[project]
name = "opensky-ingest"
version = "0.1.0"
description = "Fetch OpenSky Network state vectors and write them as JSONL.gz"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-storage>=3.16.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensky_ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
